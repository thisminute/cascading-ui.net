name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: thisminute/cascading-ui
          path: cascading-ui-compiler

      - name: Set up compiler path
        run: ln -s $GITHUB_WORKSPACE/cascading-ui-compiler ../cascading-ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM app
        run: |
          cd app
          wasm-pack build --target web

      - name: Prepare deploy directory
        run: |
          mkdir -p _site/cui
          cp target/html/index.html _site/index.html
          cp app/pkg/*.js app/pkg/*.wasm _site/cui/
          echo "cascading-ui.net" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
