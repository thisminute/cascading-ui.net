[package]
name = "cascading-ui-net"
version = "0.1.0"
edition = "2021"
description = "The cascading-ui.net website — built with CUI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cascading-ui = { git = "https://github.com/thisminute/cascading-ui" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "HtmlElement",
    "HtmlHeadElement",
    "Location",
    "Node",
    "NodeList",
    "Window",
]
